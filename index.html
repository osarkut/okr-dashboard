  <!-- Filter Bar -->
  <div class="max-w-7xl mx-auto mb-6 flex flex-wrap gap-2 items-center">
    <span class="text-xs font-semibold text-slate-400 mr-2">Highlight Category:</span>
    <button onclick="filterCategory('all')" class="filter-btn text-xs font-medium px-3 py-1.5 rounded-md bg-slate-800 text-white hover:bg-slate-700 transition">All</button>
    <button onclick="filterCategory('work')" class="filter-btn text-xs font-medium px-3 py-1.5 rounded-md bg-amber-950/60 border border-amber-800/60 text-amber-300 hover:bg-amber-900/60 transition">Work (Lowe's/OAT)</button>
    <button onclick="filterCategory('location')" class="filter-btn text-xs font-medium px-3 py-1.5 rounded-md bg-purple-950/60 border border-purple-800/60 text-purple-300 hover:bg-purple-900/60 transition">Locations</button>
    <button onclick="filterCategory('community')" class="filter-btn text-xs font-medium px-3 py-1.5 rounded-md bg-rose-950/60 border border-rose-800/60 text-rose-300 hover:bg-rose-900/60 transition">Community & Kids</button>
    <button onclick="filterCategory('vacation')" class="filter-btn text-xs font-medium px-3 py-1.5 rounded-md bg-blue-950/60 border border-blue-800/60 text-blue-300 hover:bg-blue-900/60 transition">Vacation</button>

  <!-- Calendar Grid Container -->
  <main class="max-w-7xl mx-auto bg-slate-900/70 border border-slate-800 rounded-xl overflow-hidden shadow-2xl">
    <div class="overflow-x-auto">
      <table class="w-full border-collapse min-w-[800px]">
        <thead>
          <tr class="bg-slate-950/90 text-xs font-semibold text-slate-300 border-b border-slate-800">
            <th class="p-3 w-20 text-center border-r border-slate-800">Time</th>
            <th class="p-3 text-center border-r border-slate-800">Monday <span class="block text-[10px] text-slate-500 font-normal">08/03</span></th>
            <th class="p-3 text-center border-r border-slate-800">Tuesday <span class="block text-[10px] text-slate-500 font-normal">08/04</span></th>
            <th class="p-3 text-center border-r border-slate-800">Wednesday <span class="block text-[10px] text-slate-500 font-normal">08/05</span></th>
            <th class="p-3 text-center border-r border-slate-800">Thursday <span class="block text-[10px] text-slate-500 font-normal">08/06</span></th>
            <th class="p-3 text-center border-r border-slate-800">Friday <span class="block text-[10px] text-slate-500 font-normal">08/07</span></th>
            <th class="p-3 text-center border-r border-slate-800">Saturday <span class="block text-[10px] text-slate-500 font-normal">08/08</span></th>
            <th class="p-3 text-center">Sunday <span class="block text-[10px] text-slate-500 font-normal">08/09</span></th>
          </tr>
        </thead>
        <tbody id="schedule-body" class="text-xs divide-y divide-slate-800/60">
          <!-- Rendered via JS -->
        </tbody>
      </table>
    </div>
  </main>

  <script>

    const scheduleData = [
      { time: "6:00 am",  mon: { text: "Tech Hub", cat: "location" }, tue: { text: "Home Office", cat: "location" }, wed: { text: "Home Office", cat: "location" }, thu: { text: "Tech Hub", cat: "location" }, fri: { text: "Mooresville", cat: "location" }, sat: { text: "Vacation", cat: "vacation" }, sun: { text: "Vacation", cat: "vacation" } },
      { time: "7:00 am",  mon: { text: "Lowe's", cat: "work" }, tue: { text: "Lowe's", cat: "work" }, wed: { text: "Lowe's", cat: "work" }, thu: { text: "Lowe's", cat: "work" }, fri: { text: "Lowe's", cat: "work" }, sat: { text: "", cat: "" }, sun: { text: "Vacation", cat: "vacation" } },
      { time: "8:00 am",  mon: { text: "Lowe's", cat: "work" }, tue: { text: "Lowe's", cat: "work" }, wed: { text: "Lowe's", cat: "work" }, thu: { text: "Lowe's", cat: "work" }, fri: { text: "Lowe's", cat: "work" }, sat: { text: "", cat: "" }, sun: { text: "Vacation", cat: "vacation" } },
      { time: "9:00 am",  mon: { text: "Lowe's", cat: "work" }, tue: { text: "Lowe's", cat: "work" }, wed: { text: "Lowe's", cat: "work" }, thu: { text: "Lowe's", cat: "work" }, fri: { text: "Lowe's", cat: "work" }, sat: { text: "", cat: "" }, sun: { text: "Vacation", cat: "vacation" } },
      { time: "10:00 am", mon: { text: "Lowe's", cat: "work" }, tue: { text: "Lowe's", cat: "work" }, wed: { text: "Lowe's", cat: "work" }, thu: { text: "Lowe's", cat: "work" }, fri: { text: "Lowe's", cat: "work" }, sat: { text: "", cat: "" }, sun: { text: "Vacation", cat: "vacation" } },
      { time: "11:00 am", mon: { text: "Lowe's", cat: "work" }, tue: { text: "Lowe's", cat: "work" }, wed: { text: "Lowe's", cat: "work" }, thu: { text: "Lowe's", cat: "work" }, fri: { text: "Lowe's", cat: "work" }, sat: { text: "Drive", cat: "travel" }, sun: { text: "Vacation", cat: "vacation" } },
      { time: "12:00 pm", mon: { text: "Lowe's", cat: "work" }, tue: { text: "Fatih - OAT", cat: "work" }, wed: { text: "Lowe's", cat: "work" }, thu: { text: "Lowe's", cat: "work" }, fri: { text: "Lowe's", cat: "work" }, sat: { text: "Drive", cat: "travel" }, sun: { text: "Vacation", cat: "vacation" } },
      { time: "1:00 pm",  mon: { text: "Lowe's", cat: "work" }, tue: { text: "Lowe's", cat: "work" }, wed: { text: "Lowe's", cat: "work" }, thu: { text: "Lowe's", cat: "work" }, fri: { text: "Jumah", cat: "personal" }, sat: { text: "Lunch", cat: "personal" }, sun: { text: "Vacation", cat: "vacation" } },
      { time: "2:00 pm",  mon: { text: "Lowe's", cat: "work" }, tue: { text: "Lowe's", cat: "work" }, wed: { text: "Lowe's", cat: "work" }, thu: { text: "Lowe's", cat: "work" }, fri: { text: "Lowe's", cat: "work" }, sat: { text: "Drive", cat: "travel" }, sun: { text: "Vacation", cat: "vacation" } },
      { time: "3:00 pm",  mon: { text: "Lowe's", cat: "work" }, tue: { text: "Lowe's", cat: "work" }, wed: { text: "Lowe's", cat: "work" }, thu: { text: "Lowe's", cat: "work" }, fri: { text: "Lowe's", cat: "work" }, sat: { text: "Drive", cat: "travel" }, sun: { text: "Vacation", cat: "vacation" } },
      { time: "4:00 pm",  mon: { text: "Drive", cat: "travel" }, tue: { text: "Lowe's", cat: "work" }, wed: { text: "Lowe's", cat: "work" }, thu: { text: "Drive", cat: "travel" }, fri: { text: "Lowe's", cat: "work" }, sat: { text: "Check in Resort", cat: "vacation" }, sun: { text: "Vacation", cat: "vacation" } },
      { time: "5:00 pm",  mon: { text: "Yaman's Taekwondo", cat: "kids" }, tue: { text: "Yaman's Taekwondo", cat: "kids" }, wed: { text: "Mosaic 5:30", cat: "community" }, thu: { text: "AI Working Session", cat: "ai" }, fri: { text: "Dinner", cat: "personal" }, sat: { text: "Vacation", cat: "vacation" }, sun: { text: "Vacation", cat: "vacation" } },
      { time: "6:00 pm",  mon: { text: "Yaman", cat: "kids" }, tue: { text: "Book Club", cat: "community" }, wed: { text: "Mosaic Meeting", cat: "community" }, thu: { text: "AI Working Session", cat: "ai" }, fri: { text: "Yaman", cat: "kids" }, sat: { text: "Vacation", cat: "vacation" }, sun: { text: "Vacation", cat: "vacation" } },
      { time: "7:00 pm",  mon: { text: "SCM Board", cat: "community" }, tue: { text: "Book Club", cat: "community" }, wed: { text: "Mosaic Meeting", cat: "community" }, thu: { text: "Course", cat: "ai" }, fri: { text: "Yaman", cat: "kids" }, sat: { text: "Vacation", cat: "vacation" }, sun: { text: "Vacation", cat: "vacation" } },
      { time: "8:00 pm",  mon: { text: "Mosaic Relief", cat: "community" }, tue: { text: "Book Club", cat: "community" }, wed: { text: "Mosaic Meeting", cat: "community" }, thu: { text: "Iron5", cat: "personal" }, fri: { text: "Barakah Bros", cat: "community" }, sat: { text: "Vacation", cat: "vacation" }, sun: { text: "Vacation", cat: "vacation" } },
      { time: "9:00 pm",  mon: { text: "Mosaic Executives", cat: "community" }, tue: { text: "Book Club", cat: "community" }, wed: { text: "Mosaic Meeting", cat: "community" }, thu: { text: "Therapy", cat: "personal" }, fri: { text: "Barakah Bros", cat: "community" }, sat: { text: "Vacation", cat: "vacation" }, sun: { text: "Vacation", cat: "vacation" } },
      { time: "10:00 pm", mon: { text: "Mosaic Executives", cat: "community" }, tue: { text: "Watch", cat: "personal" }, wed: { text: "Mosaic Meeting", cat: "community" }, thu: { text: "Mentorship", cat: "work" }, fri: { text: "Barakah Bros", cat: "community" }, sat: { text: "Vacation", cat: "vacation" }, sun: { text: "Vacation", cat: "vacation" } },
      { time: "11:00 pm", mon: { text: "Read", cat: "personal" }, tue: { text: "Watch", cat: "personal" }, wed: { text: "Mosaic Meeting", cat: "community" }, thu: { text: "Mentorship", cat: "work" }, fri: { text: "Barakah Bros", cat: "community" }, sat: { text: "Vacation", cat: "vacation" }, sun: { text: "Vacation", cat: "vacation" } },
      { time: "12:00 am", mon: { text: "Reflection", cat: "personal" }, tue: { text: "Reflection", cat: "personal" }, wed: { text: "Reflection", cat: "personal" }, thu: { text: "Reflection", cat: "personal" }, fri: { text: "Reflection", cat: "personal" }, sat: { text: "Vacation", cat: "vacation" }, sun: { text: "Vacation", cat: "vacation" } },
      { time: "1:00 am",  mon: { text: "Sleep", cat: "sleep" }, tue: { text: "Sleep", cat: "sleep" }, wed: { text: "Sleep", cat: "sleep" }, thu: { text: "Sleep", cat: "sleep" }, fri: { text: "Sleep", cat: "sleep" }, sat: { text: "Sleep", cat: "sleep" }, sun: { text: "Sleep", cat: "sleep" } }
    ];

    // Color mapper replicating your spreadsheet styles
    function getCellStyles(item) {
      if (!item.text) return "bg-slate-900/40 text-slate-600";

      switch(item.cat) {
        case "location":
          return "bg-purple-900/80 text-purple-200 font-semibold border-l-2 border-purple-400";
        case "work":
          return "bg-amber-100/10 text-amber-200 border-l-2 border-amber-500/80";
        case "kids":
          return "bg-slate-800 text-rose-400 font-semibold border-l-2 border-rose-500";
        case "community":
          return "bg-slate-800 text-amber-400 font-medium border-l-2 border-amber-400";
        case "ai":
          return "bg-teal-950/80 text-teal-300 font-medium border-l-2 border-teal-400";
        case "vacation":
          return "bg-purple-950/70 text-purple-300 italic font-semibold border-l-2 border-purple-400";
        case "travel":
          return "bg-slate-800/80 text-slate-300 italic";
        case "sleep":
          return "bg-blue-950 text-blue-300 font-bold tracking-wider";
        default:
          return "bg-slate-800/60 text-slate-200";
      }
    }

    const days = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];

    function renderSchedule(activeCat = 'all') {
      const tbody = document.getElementById('schedule-body');
      tbody.innerHTML = '';

      scheduleData.forEach(row => {
        const tr = document.createElement('tr');
        
        // Time Cell
        let html = `<td class="p-2.5 text-center font-mono text-[11px] text-slate-400 font-medium border-r border-slate-800 bg-slate-950/60">${row.time}</td>`;

        days.forEach(day => {
          const item = row[day];
          const styleClass = getCellStyles(item);
          const isHighlighted = activeCat === 'all' || 
                                (activeCat === 'work' && item.cat === 'work') ||
                                (activeCat === 'location' && item.cat === 'location') ||
                                (activeCat === 'community' && (item.cat === 'community' || item.cat === 'kids')) ||
                                (activeCat === 'vacation' && item.cat === 'vacation');

          const opacityClass = isHighlighted ? 'opacity-100 scale-100' : 'opacity-20 blur-[0.5px]';

          html += `
            <td class="p-1 border-r border-slate-800/60 transition-all duration-200">
              <div class="p-2 rounded min-h-[34px] flex items-center justify-center text-center ${styleClass} ${opacityClass}">
                ${item.text}
              </div>
            </td>
          `;
        });

        tr.innerHTML = html;
        tbody.appendChild(tr);
      });
    }

    function filterCategory(cat) {
      renderSchedule(cat);
    }

    // Initial render
    renderSchedule('all');
  </script>
</body>
</html>
