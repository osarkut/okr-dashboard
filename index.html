<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H2 2026 OKR & Role Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6 md:p-10">

  <div class="max-w-7xl mx-auto space-y-8">
    
    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between border-b border-gray-800 pb-6 gap-4">
      <div>
        <h1 class="text-3xl font-extrabold text-blue-400 tracking-tight">H2 2026 Dual Dashboard</h1>
        <p class="text-gray-400 text-sm mt-1">Interactive OKR Progress & Role-Based Time Allocation</p>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-xs text-purple-400 font-semibold bg-purple-950/60 border border-purple-800 px-3.5 py-1.5 rounded-full">📍 Week 32 (Current)</span>
      </div>
    </div>

    <!-- View Switcher & Week Bar -->
    <div class="bg-gray-800 border border-gray-700/60 p-4 rounded-xl flex flex-col md:flex-row items-center justify-between gap-4">
      <!-- Perspective Toggle -->
      <div class="flex bg-gray-900 p-1 rounded-lg border border-gray-700">
        <button id="btn-view-okr" onclick="switchView('okr')" class="px-4 py-1.5 rounded-md text-xs font-bold transition bg-blue-600 text-white">🎯 OKR Progress View</button>
        <button id="btn-view-role" onclick="switchView('role')" class="px-4 py-1.5 rounded-md text-xs font-bold transition text-gray-400 hover:text-white">📊 Role Hours View</button>
      </div>

      <!-- Week Buttons -->
      <div class="flex flex-wrap gap-2" id="week-buttons"></div>
    </div>

    <!-- Summary Metrics Bar -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-gray-800 border border-gray-700/60 p-4 rounded-xl">
        <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Active Week Score</span>
        <div id="overall-score" class="text-3xl font-bold text-blue-400 mt-1">--%</div>
      </div>
      <div class="bg-gray-800 border border-gray-700/60 p-4 rounded-xl">
        <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Total Logged Hours</span>
        <div id="total-hours" class="text-3xl font-bold text-green-400 mt-1">-- hrs</div>
      </div>
      <div class="bg-gray-800 border border-gray-700/60 p-4 rounded-xl">
        <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Top Time Category</span>
        <div id="top-category" class="text-3xl font-bold text-gray-200 mt-1">Work</div>
      </div>
      <div class="bg-gray-800 border border-gray-700/60 p-4 rounded-xl">
        <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Current Cycle</span>
        <div id="active-week-label" class="text-3xl font-bold text-purple-400 mt-1">W32 <span class="text-xs text-gray-400 font-normal">/ W52</span></div>
      </div>
    </div>

    <!-- Chart Section -->
    <div class="bg-gray-800 border border-gray-700/60 p-6 rounded-xl shadow-lg">
      <div class="flex justify-between items-center mb-4">
        <h2 id="chart-title" class="text-lg font-bold text-gray-200">5-Week Execution Progress Trend</h2>
        <span class="text-xs text-gray-400">Click points/bars to inspect</span>
      </div>
      <div class="h-64 relative">
        <canvas id="mainChart"></canvas>
      </div>
    </div>

    <!-- Dynamic Scorecards Grid -->
    <div>
      <h2 class="text-xl font-bold text-gray-200 mb-4" id="cards-title">Objectives & Key Results</h2>
      <div id="cards-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

  </div>

  <!-- Detail Modal for Interactive Click -->
  <div id="detail-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50 backdrop-blur-sm">
    <div class="bg-gray-800 border border-gray-700 p-6 rounded-xl max-w-lg w-full space-y-4 relative shadow-2xl">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white font-bold text-lg">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script>
    let currentView = 'okr'; // 'okr' or 'role'
    let selectedWeek = 'W32';
    let chartInstance = null;

    // DATASET (OKR & ROLE HOURS)
    const MULTI_WEEK_DATA = {
      "W28": {
        label: "Week 28", score: 32, totalHrs: 104,
        roles: { Work: 52, Individual: 12, Family: 25, Community: 13, Career: 0, Mentorship: 2 },
        okrs: [
          { id: "W-LOW", domain: "Wealth", name: "Lowe's — Principal PM", score: 20, hrs: 52, krs: ["Mylow vision deck started", "1:1 Strategy initialized"] },
          { id: "W-OAT", domain: "Wealth", name: "OAT Marketing", score: 20, hrs: 4, krs: ["Delivery review pending"] },
          { id: "H-EXR", domain: "Health", name: "Exercise & Physical Health", score: 25, hrs: 3, krs: ["1 gym workout logged"] },
          { id: "WI-WRT", domain: "Wisdom", name: "Writing & Thinking", score: 50, hrs: 2, krs: ["Weekly reflection block done"] },
          { id: "R-PAR", domain: "Relationships", name: "Parenting & Family", score: 40, hrs: 25, krs: ["Family dinner & reading"] },
          { id: "S-MOS", domain: "Service", name: "Mosaic & Community", score: 60, hrs: 13, krs: ["Mosaic breakfast & relief"] }
        ]
      },
      "W29": {
        label: "Week 29", score: 34, totalHrs: 107,
        roles: { Work: 54, Individual: 15, Family: 19, Community: 15, Career: 2, Mentorship: 2 },
        okrs: [
          { id: "W-LOW", domain: "Wealth", name: "Lowe's — Principal PM", score: 22, hrs: 54, krs: ["Mylow outline drafted", "1:1 list finalized"] },
          { id: "W-OAT", domain: "Wealth", name: "OAT Marketing", score: 25, hrs: 4, krs: ["Capped hours at 4h"] },
          { id: "H-EXR", domain: "Health", name: "Exercise & Physical Health", score: 50, hrs: 4, krs: ["2 workouts logged"] },
          { id: "WI-WRT", domain: "Wisdom", name: "Writing & Thinking", score: 50, hrs: 2, krs: ["Reflection block done"] },
          { id: "R-PAR", domain: "Relationships", name: "Parenting & Family", score: 40, hrs: 19, krs: ["Taekwondo attended"] },
          { id: "S-MOS", domain: "Service", name: "Mosaic & Community", score: 50, hrs: 15, krs: ["15 community hours logged"] }
        ]
      },
      "W30": {
        label: "Week 30", score: 36, totalHrs: 107,
        roles: { Work: 52, Individual: 17, Family: 19, Community: 15, Career: 4, Mentorship: 0 },
        okrs: [
          { id: "W-LOW", domain: "Wealth", name: "Lowe's — Principal PM", score: 25, hrs: 52, krs: ["Mylow deck 70% complete", "LinkedIn post drafted"] },
          { id: "W-OAT", domain: "Wealth", name: "OAT Marketing", score: 25, hrs: 4, krs: ["Direct involvement kept low"] },
          { id: "H-EXR", domain: "Health", name: "Exercise & Physical Health", score: 50, hrs: 4, krs: ["2 workouts logged"] },
          { id: "WI-WRT", domain: "Wisdom", name: "Writing & Thinking", score: 50, hrs: 2, krs: ["Reflection block done"] },
          { id: "R-PAR", domain: "Relationships", name: "Parenting & Family", score: 40, hrs: 19, krs: ["Passport photos planned"] },
          { id: "S-MOS", domain: "Service", name: "Mosaic & Community", score: 50, hrs: 15, krs: ["Mosaic Directors meeting"] }
        ]
      },
      "W31": {
        label: "Week 31", score: 38, totalHrs: 107,
        roles: { Work: 65, Individual: 11, Family: 14, Community: 16, Career: 1, Mentorship: 0 },
        okrs: [
          { id: "W-LOW", domain: "Wealth", name: "Lowe's — Principal PM", score: 28, hrs: 65, krs: ["Present Mylow vision deck (100% - Done)", "Complete 1:1s with 5 leaders (20% - 1/5)", "Publish 8 LinkedIn posts (12% - 1/8)"] },
          { id: "W-OAT", domain: "Wealth", name: "OAT Marketing", score: 25, hrs: 4, krs: ["Cap involvement at 4h/wk (100% - On track)", "Fatih strategy meetings held (50%)"] },
          { id: "H-EXR", domain: "Health", name: "Exercise & Physical Health", score: 50, hrs: 4, krs: ["Exercise 4x/week (50% - 2/4 done)", "Back mobility work 3x/wk (33%)"] },
          { id: "WI-WRT", domain: "Wisdom", name: "Writing & Thinking", score: 50, hrs: 1, krs: ["One 60-min reflection block (100% - Done)"] },
          { id: "R-PAR", domain: "Relationships", name: "Parenting & Family", score: 40, hrs: 14, krs: ["Duru driving & passports (50% - Photos done)", "Yaman courses & Taekwondo (100% - Done)"] },
          { id: "S-MOS", domain: "Service", name: "Mosaic & Community", score: 50, hrs: 16, krs: ["Cap community at 11h/wk (0% - Exceeded at 16h)", "Protect biweekly Relief block (100% - Done)"] }
        ]
      },
      "W32": {
        label: "Week 32 (Current)", score: 52, totalHrs: 105,
        roles: { Work: 50, Individual: 22, Family: 11, Community: 8, Career: 9, Mentorship: 5 },
        okrs: [
          { id: "W-LOW", domain: "Wealth", name: "Lowe's — Principal PM", score: 45, hrs: 50, krs: ["Schedule 2 senior 1:1s", "Publish 2nd LinkedIn post", "Write Mylow strategy narrative"] },
          { id: "W-OAT", domain: "Wealth", name: "OAT Marketing", score: 40, hrs: 4, krs: ["Finalize delivery ownership document"] },
          { id: "H-EXR", domain: "Health", name: "Exercise & Physical Health", score: 75, hrs: 4, krs: ["4 workouts scheduled", "3 mobility blocks planned"] },
          { id: "WI-WRT", domain: "Wisdom", name: "Writing & Thinking", score: 60, hrs: 9, krs: ["Article 1 draft outline & Google prompt course"] },
          { id: "R-PAR", domain: "Relationships", name: "Parenting & Family", score: 60, hrs: 11, krs: ["Submit Canada passport application", "Duru driving school booking"] },
          { id: "S-MOS", domain: "Service", name: "Mosaic & Community", score: 80, hrs: 8, krs: ["Enforce 11h community cap (Delegate 5 hrs)"] }
        ]
      }
    };

    function initButtons() {
      const container = document.getElementById('week-buttons');
      container.innerHTML = '';

      Object.keys(MULTI_WEEK_DATA).forEach(weekKey => {
        const isCurrent = weekKey === selectedWeek;
        let btnClass = isCurrent 
          ? "bg-blue-600 text-white font-bold border-blue-500 shadow-lg scale-105" 
          : "bg-gray-700 hover:bg-gray-600 text-gray-300 font-medium border-gray-600";

        if (weekKey === "W32") btnClass += " border-2 border-purple-400";

        const btn = document.createElement('button');
        btn.className = `px-3 py-1.5 rounded-lg text-xs border transition-all duration-150 ${btnClass}`;
        btn.innerText = weekKey === "W32" ? "W32 (Current)" : weekKey;
        btn.onclick = () => { selectedWeek = weekKey; initButtons(); renderDashboard(); };
        container.appendChild(btn);
      });
    }

    function switchView(view) {
      currentView = view;
      document.getElementById('btn-view-okr').className = view === 'okr' 
        ? "px-4 py-1.5 rounded-md text-xs font-bold transition bg-blue-600 text-white" 
        : "px-4 py-1.5 rounded-md text-xs font-bold transition text-gray-400 hover:text-white";

      document.getElementById('btn-view-role').className = view === 'role' 
        ? "px-4 py-1.5 rounded-md text-xs font-bold transition bg-blue-600 text-white" 
        : "px-4 py-1.5 rounded-md text-xs font-bold transition text-gray-400 hover:text-white";

      renderDashboard();
    }

    function renderDashboard() {
      const weekData = MULTI_WEEK_DATA[selectedWeek];

      document.getElementById('overall-score').innerText = `${weekData.score}%`;
      document.getElementById('total-hours').innerText = `${weekData.totalHrs} hrs`;
      document.getElementById('active-week-label').innerHTML = `${selectedWeek} <span class="text-xs text-gray-400 font-normal">/ W52</span>`;

      // Find top role category
      const topRole = Object.entries(weekData.roles).reduce((a, b) => a[1] > b[1] ? a : b);
      document.getElementById('top-category').innerText = topRole[0];

      if (currentView === 'okr') {
        renderOKRView(weekData);
      } else {
        renderRoleView(weekData);
      }
    }

    function renderOKRView(weekData) {
      document.getElementById('chart-title').innerText = "OKR Completion Score Trend (%)";
      document.getElementById('cards-title').innerText = `${weekData.label} — OKR Breakdown (Click for details)`;

      const grid = document.getElementById('cards-grid');
      grid.innerHTML = '';

      weekData.okrs.forEach((obj, idx) => {
        let badgeColor = obj.score >= 70 ? 'bg-green-500/20 text-green-400 border-green-500/30' : (obj.score >= 40 ? 'bg-yellow-500/20 text-yellow-400 border-yellow-500/30' : 'bg-red-500/20 text-red-400 border-red-500/30');
        let barColor = obj.score >= 70 ? 'bg-green-500' : (obj.score >= 40 ? 'bg-yellow-500' : 'bg-red-500');

        const card = `
          <div onclick="openModal('${obj.id}')" class="bg-gray-800 border border-gray-700/70 p-5 rounded-xl shadow-md cursor-pointer hover:border-blue-500 hover:scale-[1.01] transition">
            <div class="flex items-center justify-between mb-3">
              <span class="text-xs font-bold uppercase tracking-wider text-blue-400 bg-blue-950/60 px-2.5 py-1 rounded border border-blue-800/50">${obj.domain}</span>
              <span class="text-xs font-bold px-2.5 py-0.5 rounded border ${badgeColor}">${obj.score}%</span>
            </div>
            <div class="text-xs font-mono text-gray-500">${obj.id}</div>
            <h3 class="font-bold text-gray-100 text-base mb-2 leading-snug">${obj.name}</h3>
            <div class="w-full bg-gray-700/60 h-2 rounded-full overflow-hidden mb-4">
              <div class="${barColor} h-full transition-all duration-500" style="width: ${obj.score}%"></div>
            </div>
            <div class="text-xs text-gray-400 border-t border-gray-700/50 pt-3">
              <strong>Key Results:</strong> ${obj.krs.length} tracked. <span class="text-blue-400 underline">Click to inspect →</span>
            </div>
          </div>
        `;
        grid.innerHTML += card;
      });

      renderOKRChart();
    }

    function renderRoleView(weekData) {
      document.getElementById('chart-title').innerText = "Role Hours Trend (Work, Family, Health, Community)";
      document.getElementById('cards-title').innerText = `${weekData.label} — Role Hours Allocation (Click for details)`;

      const grid = document.getElementById('cards-grid');
      grid.innerHTML = '';

      Object.entries(weekData.roles).forEach(([role, hrs]) => {
        const card = `
          <div onclick="openRoleModal('${role}', ${hrs})" class="bg-gray-800 border border-gray-700/70 p-5 rounded-xl shadow-md cursor-pointer hover:border-purple-500 hover:scale-[1.01] transition">
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-bold uppercase text-purple-400 bg-purple-950/60 px-2.5 py-1 rounded border border-purple-800/50">Role Category</span>
              <span class="text-lg font-bold text-green-400">${hrs} hrs</span>
            </div>
            <h3 class="font-bold text-gray-100 text-xl mb-3">${role}</h3>
            <div class="w-full bg-gray-700/60 h-2 rounded-full overflow-hidden">
              <div class="bg-purple-500 h-full" style="width: ${Math.min((hrs/60)*100, 100)}%"></div>
            </div>
          </div>
        `;
        grid.innerHTML += card;
      });

      renderRoleChart();
    }

    function renderOKRChart() {
      const ctx = document.getElementById('mainChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      const weekKeys = Object.keys(MULTI_WEEK_DATA);
      const scores = weekKeys.map(k => MULTI_WEEK_DATA[k].score);

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: weekKeys.map(k => MULTI_WEEK_DATA[k].label),
          datasets: [{
            label: 'Overall OKR Progress %',
            data: scores,
            borderColor: '#3B82F6',
            backgroundColor: 'rgba(59, 130, 246, 0.1)',
            fill: true,
            tension: 0.3,
            borderWidth: 3
          }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    function renderRoleChart() {
      const ctx = document.getElementById('mainChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      const weekKeys = Object.keys(MULTI_WEEK_DATA);
      const rolesList = ['Work', 'Individual', 'Family', 'Community', 'Career', 'Mentorship'];
      const colors = ['#3B82F6', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6', '#EC4899'];

      const datasets = rolesList.map((role, idx) => ({
        label: role,
        data: weekKeys.map(k => MULTI_WEEK_DATA[k].roles[role] || 0),
        borderColor: colors[idx],
        tension: 0.3,
        borderWidth: 2
      }));

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: { labels: weekKeys, datasets: datasets },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    function openModal(okrId) {
      const weekData = MULTI_WEEK_DATA[selectedWeek];
      const obj = weekData.okrs.find(o => o.id === okrId);
      if (!obj) return;

      const krList = obj.krs.map(k => `<li class="text-sm text-gray-300">• ${k}</li>`).join('');

      document.getElementById('modal-content').innerHTML = `
        <div class="text-xs font-mono text-blue-400 uppercase tracking-widest">${obj.id} — ${obj.domain}</div>
        <h2 class="text-xl font-bold text-white mb-2">${obj.name}</h2>
        <div class="bg-gray-900 p-3 rounded-lg border border-gray-700">
          <div class="text-xs text-gray-400">Current Score: <strong class="text-white text-sm">${obj.score}%</strong></div>
          <div class="text-xs text-gray-400 mt-1">Hours Logged This Week: <strong class="text-green-400 text-sm">${obj.hrs} hrs</strong></div>
        </div>
        <div class="mt-4">
          <h4 class="text-xs font-bold uppercase text-gray-400 mb-2">Key Result Progress</h4>
          <ul class="space-y-2">${krList}</ul>
        </div>
      `;
      document.getElementById('detail-modal').classList.remove('hidden');
      document.getElementById('detail-modal').classList.add('flex');
    }

    function openRoleModal(role, hrs) {
      document.getElementById('modal-content').innerHTML = `
        <div class="text-xs font-mono text-purple-400 uppercase tracking-widest">Role Breakdown</div>
        <h2 class="text-xl font-bold text-white mb-2">${role} Role</h2>
        <div class="bg-gray-900 p-4 rounded-lg border border-gray-700">
          <span class="text-xs text-gray-400 block">Logged Time for ${selectedWeek}</span>
          <span class="text-3xl font-extrabold text-green-400">${hrs} hours</span>
        </div>
      `;
      document.getElementById('detail-modal').classList.remove('hidden');
      document.getElementById('detail-modal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('detail-modal').classList.add('hidden');
      document.getElementById('detail-modal').classList.remove('flex');
    }

    // Init
    initButtons();
    renderDashboard();
  </script>
</body>
</html>
