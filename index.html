<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H2 2026 OKR Executive Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6 md:p-10">

  <div class="max-w-7xl mx-auto space-y-8">
    
    <!-- Top Header -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between border-b border-gray-800 pb-6 gap-4">
      <div>
        <h1 class="text-3xl font-extrabold text-blue-400 tracking-tight">H2 2026 OKR Executive Dashboard</h1>
        <p class="text-gray-400 text-sm mt-1">Live OKR Tracking & Status Scorecard</p>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-xs text-green-400 font-semibold bg-green-950/60 border border-green-800 px-3 py-1 rounded-full">● Local Data Loaded</span>
      </div>
    </div>

    <!-- Summary Metrics Bar -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-gray-800 border border-gray-700/60 p-4 rounded-xl">
        <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Overall H2 Score</span>
        <div id="overall-score" class="text-3xl font-bold text-blue-400 mt-1">38%</div>
      </div>
      <div class="bg-gray-800 border border-gray-700/60 p-4 rounded-xl">
        <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Active Objectives</span>
        <div id="active-objs" class="text-3xl font-bold text-gray-200 mt-1">8</div>
      </div>
      <div class="bg-gray-800 border border-gray-700/60 p-4 rounded-xl">
        <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Tracked Key Results</span>
        <div id="total-krs" class="text-3xl font-bold text-gray-200 mt-1">18</div>
      </div>
      <div class="bg-gray-800 border border-gray-700/60 p-4 rounded-xl">
        <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Cycle Progress</span>
        <div class="text-3xl font-bold text-purple-400 mt-1">W31 <span class="text-xs text-gray-400 font-normal">/ W52</span></div>
      </div>
    </div>

    <!-- Chart Breakdown Section -->
    <div class="bg-gray-800 border border-gray-700/60 p-6 rounded-xl shadow-lg">
      <h2 class="text-lg font-bold text-gray-200 mb-4">Objective Progress Overview</h2>
      <div class="h-64 relative">
        <canvas id="okrChart"></canvas>
      </div>
    </div>

    <!-- Dynamic Scorecard Cards Grid -->
    <div>
      <h2 class="text-xl font-bold text-gray-200 mb-4">Domain Objectives Scorecard</h2>
      <div id="scorecard-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

  </div>

  <script>
    // EXACT DATA LOADED FROM YOUR OKR FRAMEWORK
    const OKR_DATA = [
      {
        id: "W-LOW", domain: "Wealth", name: "Lowe's — Principal PM (Agentic AI)", score: 28, hrs: 4.4,
        krs: [
          "Present Mylow vision deck to leadership (100% - Done)",
          "Complete 1:1s with 5 senior leaders (20% - 1/5)",
          "Publish 8 LinkedIn posts on AI leadership (12% - 1/8)",
          "Write reusable Mylow impact narrative (0%)"
        ]
      },
      {
        id: "W-OAT", domain: "Wealth", name: "OAT Marketing", score: 25, hrs: 0.7,
        krs: [
          "Cap direct involvement at 4 hours/week (100% - On track)",
          "Define delivery/comms ownership across team (50%)",
          "Decide by 31 Dec: keep, sell, or wind down (0%)"
        ]
      },
      {
        id: "W-VIZ", domain: "Wealth", name: "AI & Digital Ventures (Visualizer)", score: 25, hrs: 1.9,
        krs: [
          "Write one-page thesis (0%)",
          "Complete 15 customer interviews (0%)",
          "Compare Visualizer vs DTF Sign on scorecard (50%)"
        ]
      },
      {
        id: "H-EXR", domain: "Health", name: "Exercise & Physical Health", score: 50, hrs: 3.8,
        krs: [
          "Exercise at least 4 times per week (50% - 2/4 done)",
          "2 strength sessions per week (50%)",
          "Back & mobility work 3 times/week (33%)"
        ]
      },
      {
        id: "H-SLP", domain: "Health", name: "Sleep Consistency", score: 40, hrs: 0.3,
        krs: [
          "Maintain at least 6h30m average total sleep (38% - 6.0h avg)",
          "Run 3 structured sleep experiments (0%)"
        ]
      },
      {
        id: "WI-WRT", domain: "Wisdom", name: "Writing & Thinking", score: 50, hrs: 1.6,
        krs: [
          "Publish 2 long-form articles (0%)",
          "One 60-minute reflection block per week (100% - Done)"
        ]
      },
      {
        id: "R-PAR", domain: "Relationships", name: "Parenting (Duru & Yaman)", score: 40, hrs: 2.2,
        krs: [
          "Duru: driving school & 1:1 outings (50% - Passports done)",
          "Yaman: register for courses & attend weekly (100% - Done)"
        ]
      },
      {
        id: "S-MOS", domain: "Service", name: "Mosaic & Community Service", score: 50, hrs: 0.2,
        krs: [
          "Cap community work at 11 hours per week (0% - Exceeded at 16h)",
          "Protect biweekly 3-hour Mosaic Relief block (100% - Done)"
        ]
      }
    ];

    function renderDashboard() {
      const grid = document.getElementById('scorecard-grid');
      grid.innerHTML = '';

      const labels = [];
      const scores = [];

      OKR_DATA.forEach(obj => {
        labels.push(obj.id);
        scores.push(obj.score);

        let badgeColor = 'bg-red-500/20 text-red-400 border-red-500/30';
        let barColor = 'bg-red-500';
        if (obj.score >= 70) {
          badgeColor = 'bg-green-500/20 text-green-400 border-green-500/30';
          barColor = 'bg-green-500';
        } else if (obj.score >= 40) {
          badgeColor = 'bg-yellow-500/20 text-yellow-400 border-yellow-500/30';
          barColor = 'bg-yellow-500';
        }

        const krHtml = obj.krs.map(kr => `
          <li class="text-xs text-gray-400 flex items-start gap-1.5">
            <span class="text-blue-400">•</span>
            <span>${kr}</span>
          </li>
        `).join('');

        const card = `
          <div class="bg-gray-800 border border-gray-700/70 p-5 rounded-xl shadow-md flex flex-col justify-between hover:border-gray-600 transition">
            <div>
              <div class="flex items-center justify-between mb-3">
                <span class="text-xs font-bold uppercase tracking-wider text-blue-400 bg-blue-950/60 px-2.5 py-1 rounded border border-blue-800/50">${obj.domain}</span>
                <span class="text-xs font-bold px-2.5 py-0.5 rounded border ${badgeColor}">${obj.score}%</span>
              </div>

              <div class="text-xs font-mono text-gray-500">${obj.id}</div>
              <h3 class="font-bold text-gray-100 text-base mb-2 leading-snug">${obj.name}</h3>

              <div class="w-full bg-gray-700/60 h-2 rounded-full overflow-hidden mb-4">
                <div class="${barColor} h-full transition-all duration-500" style="width: ${obj.score}%"></div>
              </div>

              <div class="border-t border-gray-700/50 pt-3 mt-3">
                <span class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider block mb-2">Key Results</span>
                <ul class="space-y-1.5">
                  ${krHtml}
                </ul>
              </div>
            </div>

            <div class="mt-4 pt-2 text-[11px] text-gray-500 flex justify-between border-t border-gray-700/30">
              <span>Target Allocation: <strong class="text-gray-400">${obj.hrs} hrs/wk</strong></span>
            </div>
          </div>
        `;
        grid.innerHTML += card;
      });

      renderChart(labels, scores);
    }

    function renderChart(labels, scores) {
      const ctx = document.getElementById('okrChart').getContext('2d');
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Completion %',
            data: scores,
            backgroundColor: '#3B82F6',
            hoverBackgroundColor: '#60A5FA',
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { beginAtZero: true, max: 100, grid: { color: '#374151' }, ticks: { color: '#9CA3AF' } },
            x: { grid: { display: false }, ticks: { color: '#9CA3AF' } }
          },
          plugins: { legend: { display: false } }
        }
      });
    }

    renderDashboard();
  </script>
</body>
</html>
